<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişi Tamamla</title>
    <link rel="stylesheet" href="css/css.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/siparis.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 70px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            color: var(--text);
        }

        .navSagKismi {
            display: flex;
            align-items: center;
            gap: 50px;
            color: var(--text);
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo"><a href="anasayfa.html" style="text-decoration: none; color: var(--text);">E Ticaret</a></div>
        <div class="navSagKismi">
            <button id="temaBtn">🌙</button>
        </div>
    </header>

    <div class="siparisAnaKutu">
        <div class="solKutu">
            <h2>Teslimat ve Fatura Bilgileri</h2>
            <label for="adSoyad" id="adSoyad">Ad Soyad</label>
            <input name="adSoyad" type="text" placeholder="Adınız Soyadınız" required>

            <label for="telNo">Telefon</label>
            <input type="number" name="telNo" placeholder="05XX XXX XX XX" required>

            <label for="adres">Adres</label>
            <textarea name="adres" placeholder="Açık adresinizi giriniz..." required></textarea>

            <label for="kartİsim">Kart Üzerindeki İsim</label>
            <input type="text" name="kartİsim" placeholder="İsim Soyisim" required>

            <label for="kartNo">Kart Numarası</label>
            <input type="number" name="kartNo" maxlength="16" placeholder="XXXX XXXX XXXX XXXX" required>



            <div id="yanYana" style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <label for="sonKullanma">Son Kullanma Tarihi</label>
                    <input type="text" name="sonKullanma" maxlength="5" placeholder="AA/YY" required>
                </div>

                <div style="flex: 1;">
                    <label for="cvv">CVV</label>
                    <input type="number" name="cvv" maxlength="3" placeholder="***" required>
                </div>
            </div>
        </div>

        <div class="sagKutu">
            <h2>Sipariş Özeti</h2>


            <div id="siparisToplam">
                <div id="siparisUrunler">

                </div>

                <div class="toplamSatir">
                    <span>Ara Toplam:</span>
                    <span id="araToplamDeger">0 TL</span>
                </div>

                <div class="genelToplam">
                    <span>Genel Toplam:</span>
                    <span id="genelToplamDeger">0 TL</span>
                </div>
            </div>


            <button id="onaylaBtn" class="onaylaBtn">Siparişi Onayla</button>
            <div id="uyari" class="uyari"></div>
            <div id="basarili" class="basarili"></div>

        </div>


    </div>

    <script src="js/app.js"></script>
    <script src="js/siparis.js"></script>
</body>

</html>
