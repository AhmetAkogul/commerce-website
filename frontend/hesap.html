<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hesabım</title>
<link rel="stylesheet" href="css/css.css">
<style>


body{
    background:var(--bg);
    color:var(--text);
}

.ustBar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:1000;
}

.geriBtn{
    font-size:22px;
    cursor:pointer;
    color:var(--text);
    padding:5px 10px;
    border-radius:10px;
}

.geriBtn:hover{
    background:var(--border);
}


.hesapSayfa{
    max-width:600px;
    margin:100px auto 40px auto;
    padding:20px;
    color:var(--text);
}

.bilgiSatir{
    display:flex;
    gap:15px;
    margin-bottom:15px;
    font-size:16px;
    padding:10px;
    border-bottom:1px solid var(--border);
}

.bilgiSatir strong{
    min-width:90px;
}


#logoutBtn{
    margin-top:25px;
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    cursor:pointer;
}

#logoutBtn:hover{
    opacity:0.9;
}

#temaBtn:hover{
    background-color: var(--bg);
    transition: 0.5s;
}
</style>
</head>

<body>


<div class="ustBar">

    <span class="geriBtn" onclick="window.location.href='anasayfa.html'">←</span>
    <h2 style="position: absolute; left: 48%;">Hesabım</h2>
    <button id="temaBtn" style="margin-top: -5px;">🌙</button>

</div>

<div class="hesapSayfa">

    <div class="bilgiSatir">
        <strong>İsim:</strong>
        <span id="isim"></span>
    </div>

    <div class="bilgiSatir">
        <strong>Soyisim:</strong>
        <span id="soyisim"></span>
    </div>

    <div class="bilgiSatir">
        <strong>Email:</strong>
        <span id="email"></span>
    </div>

    <button id="logoutBtn">Çıkış Yap</button>
</div>





<script src="js/app.js"></script>
<script src="js/hesap.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    window.location.href = "login.html";
}

document.getElementById("isim").textContent = user.first_name;
document.getElementById("soyisim").textContent = user.last_name;
document.getElementById("email").textContent = user.email;


document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("user");
    window.location.href = "login.html";
});

document.querySelector(".geriBtn").addEventListener("click", () => {
    window.location.href = "anasayfa.html";
});
</script>

</body>
</html>
